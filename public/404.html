<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0f14" />
    <meta name="description" content="Page not found on Wesam Awad’s portfolio." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Page Not Found | Wesam Awad</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        display: grid;
        place-items: center;
        height: 100dvh;
        max-height: 100dvh;
        background: #0b0f14;
        color: #e6edf3;
        font-family: system-ui, sans-serif;
        text-align: center;
        padding: 16px;
      }

      h1 {
        font-size: 4rem;
        margin: 0;
        color: #34d399;
      }

      a {
        display: inline-block;
        margin-top: 24px;
        padding: 12px 24px;
        background: #34d399;
        color: #0b0f14;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
      }

      a:focus-visible {
        outline: 2px solid #34d399;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <p>This page doesn't exist.</p>
      <a href="/">Back to Home</a>
    </main>
  </body>
</html>
