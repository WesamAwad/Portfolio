<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <script>
      try {
        var saved = localStorage.getItem("theme");
        var isDark =
          saved === "dark" ||
          (saved !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", isDark);
      } catch (e) {}
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b0f14" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="author" content="Wesam Awad" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <title>Wesam Awad | Front-End Developer — React &amp; TypeScript</title>
    <meta
      name="description"
      content="Wesam Awad — Front-End Developer specializing in React, TypeScript, and Tailwind CSS. Building fast, accessible web apps with strong UI craft, performance, and SEO."
    />
    <link rel="canonical" href="https://wesam-portfolio-one.vercel.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="Wesam Awad" />
    <meta property="og:url" content="https://wesam-portfolio-one.vercel.app/" />
    <meta property="og:title" content="Wesam Awad | Front-End Developer — React &amp; TypeScript" />
    <meta
      property="og:description"
      content="Wesam Awad — Front-End Developer specializing in React, TypeScript, and Tailwind CSS. Building fast, accessible web apps with strong UI craft, performance, and SEO."
    />
    <meta property="og:image" content="https://wesam-portfolio-one.vercel.app/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Wesam Awad, Front-End Developer" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Wesam Awad | Front-End Developer — React &amp; TypeScript" />
    <meta
      name="twitter:description"
      content="Wesam Awad — Front-End Developer specializing in React, TypeScript, and Tailwind CSS. Building fast, accessible web apps with strong UI craft, performance, and SEO."
    />
    <meta name="twitter:image" content="https://wesam-portfolio-one.vercel.app/og-image.jpg" />
    <meta name="twitter:image:alt" content="Wesam Awad, Front-End Developer" />

    <!-- LCP: discoverable from the initial HTML (responsive candidates) -->
    <link
      rel="preload"
      as="image"
      href="/profile-800.webp"
      imagesrcset="/profile-640.webp 640w, /profile-800.webp 800w, /profile.webp 1024w"
      imagesizes="(max-width: 768px) min(100vw, 28rem), 32rem"
      type="image/webp"
      fetchpriority="high"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-blocking Google Fonts — only families/weights used in the UI -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Syne:wght@700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Syne:wght@700&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
